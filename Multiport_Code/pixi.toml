[workspace]
authors = ["BelaErlinghagen <bela-erl@proton.me>"]
channels = ["conda-forge", "pypi", "https://prefix.dev/conda-forge"]
name = "Multiport_Code"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
libc = { family = "glibc", version = "2.39" }
cuda = "12.0"

[tasks]

[dependencies]
pyserial = "==3.4"
python = "3.12.*"
pytorch-gpu = "*"

[pypi-dependencies]
pypylon = ">=26.2.1, <27"
deeplabcut-live = ">=1.1.0, <2"
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cu124" }

