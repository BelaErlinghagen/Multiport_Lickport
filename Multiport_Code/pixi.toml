[workspace]
authors = ["BelaErlinghagen <bela-erl@proton.me>"]
channels = ["conda-forge", "pypi", "https://prefix.dev/conda-forge"]
name = "Multiport_Code"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
libc = { family = "glibc", version = "2.39" }
cuda = "12.0"

[tasks]

[dependencies]
pyserial = "==3.4"
python = "3.12.*"
pytorch-gpu = "*"
numpy = ">=1.20, <2"
tensorflow = ">=2.19.1,<3"
ffmpeg = "*"          # H.264 encoder for sensor_test.py recordings
requests = "*"        # RSpace REST API client (rspace.py)


[pypi-dependencies]
pypylon = ">=26.2.1, <27"
deeplabcut-live = { version = ">=1.1.0, <2", extras = ["pytorch"] }
pyqt5 = ">=5.15.11, <6"
pyqtgraph = ">=0.14.0, <0.15"


